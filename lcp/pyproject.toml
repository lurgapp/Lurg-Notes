[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lcp-gateway"
version = "0.1.0"
description = "Lurg Connection Protocol gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "redis>=5.0,<6",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fakeredis>=2.26", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
