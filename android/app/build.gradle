plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.serialization"
    id "org.jetbrains.kotlin.kapt"
}

if (!project.hasProperty('notesUiTestPackage') && file("google-services.json").exists()) apply plugin: 'com.google.gms.google-services'

def requestedReleaseBuild = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains("release")
}
if (requestedReleaseBuild && project.hasProperty('notesUiTestPackage')) throw new GradleException('Notes UI test package is only available for debug builds.')

def loadAndroidSigningProperties() {
    def props = new Properties()
    def configuredPath = System.getenv("LURG_ANDROID_SIGNING_PROPERTIES")
    def propsFile = configuredPath ? new File(configuredPath) : new File(System.getProperty("user.home"), ".lurg/android-release/signing.properties")

    if (propsFile.exists()) {
        propsFile.withInputStream { props.load(it) }
    }

    [
        "LURG_ANDROID_KEYSTORE_PATH",
        "LURG_ANDROID_KEYSTORE_PASSWORD",
        "LURG_ANDROID_KEY_ALIAS",
        "LURG_ANDROID_KEY_PASSWORD"
    ].each { name ->
        def value = System.getenv(name)
        if (value) {
            props.setProperty(name, value)
        }
    }

    return props
}

def releaseSigningProperties = loadAndroidSigningProperties()
def releaseSigningReady = [
    "LURG_ANDROID_KEYSTORE_PATH",
    "LURG_ANDROID_KEYSTORE_PASSWORD",
    "LURG_ANDROID_KEY_ALIAS",
    "LURG_ANDROID_KEY_PASSWORD"
].every { releaseSigningProperties.getProperty(it) }

if (requestedReleaseBuild && !releaseSigningReady) {
    throw new GradleException("Release signing is not configured. Set LURG_ANDROID_SIGNING_PROPERTIES or LURG_ANDROID_KEYSTORE_PATH/LURG_ANDROID_KEYSTORE_PASSWORD/LURG_ANDROID_KEY_ALIAS/LURG_ANDROID_KEY_PASSWORD.")
}

android {
    namespace "pro.lurg.notes"
    compileSdk 36

    defaultConfig {
        applicationId "pro.lurg.notes"
        minSdk 23
        targetSdk 36
        versionCode 22
        versionName "0.5.4"
        buildConfigField "String", "API_BASE_URL", '"https://api.lurg.pro"'
        buildConfigField "String", "AUTH_API_URL", '"https://auth.lurg.pro/api/v1/auth"'
        buildConfigField "String", "LCP_WS_URL", '"wss://lcp.lurg.pro/connect"' 

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseSigningProperties.getProperty("LURG_ANDROID_KEYSTORE_PATH"))
                storePassword releaseSigningProperties.getProperty("LURG_ANDROID_KEYSTORE_PASSWORD")
                keyAlias releaseSigningProperties.getProperty("LURG_ANDROID_KEY_ALIAS")
                keyPassword releaseSigningProperties.getProperty("LURG_ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (project.hasProperty('notesUiTestPackage')) applicationIdSuffix '.uitest'
            buildConfigField "String", "LCP_WS_URL", groovy.json.JsonOutput.toJson(System.getenv("LURG_DEBUG_LCP_WS_URL") ?: "")
            buildConfigField "String", "API_BASE_URL", groovy.json.JsonOutput.toJson(System.getenv("LURG_DEBUG_API_URL") ?: "https://api.lurg.pro")
            buildConfigField "String", "AUTH_API_URL", groovy.json.JsonOutput.toJson(System.getenv("LURG_DEBUG_AUTH_URL") ?: "https://auth.lurg.pro/api/v1/auth")
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.14"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
    testOptions { unitTests.all { systemProperty 'lurg.fixture.apk', System.getenv('LURG_UPDATE_TEST_APK') ?: '' } }
}

dependencies {
    implementation "com.android.tools.build:apksig:8.6.1"
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    def composeBom = platform("androidx.compose:compose-bom:2024.06.00")
    implementation composeBom
    androidTestImplementation composeBom

    implementation "androidx.activity:activity-compose:1.9.2"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.runtime:runtime-livedata"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.datastore:datastore-preferences:1.1.1"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.4"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4"
    implementation "androidx.navigation:navigation-compose:2.7.7"
    implementation "androidx.room:room-ktx:2.6.1"
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation "com.tencent:mmkv:1.3.14"
    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation "io.coil-kt:coil-video:2.7.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging-ktx"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"

    kapt "androidx.room:room-compiler:2.6.1"

    debugImplementation "androidx.compose.ui:ui-tooling"
    testImplementation "junit:junit:4.13.2"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}
